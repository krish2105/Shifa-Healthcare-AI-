[project]
name = "shifa42-backend"
version = "1.0.0"
description = "Shifa42 — agentic clinical intelligence copilot (FastAPI + LangGraph)"
requires-python = ">=3.11,<3.12"

dependencies = [
    # --- API layer ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # --- agent + LLM ---
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "litellm>=1.52",
    # --- retrieval ---
    "sentence-transformers>=3.2",
    "torch>=2.5",
    "rank-bm25>=0.2.2",
    "networkx>=3.4",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    # --- data + ML ---
    "datasets>=3.1",
    "huggingface-hub>=0.26",
    "numpy>=1.26,<2.2",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "scipy>=1.14",
    # --- ops ---
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "tenacity>=9.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
]
# RAGAS is kept optional on purpose — see docs/specs. Our RAGAS-definition metrics
# are implemented natively in app/eval/metrics.py so the critic path has no heavy
# dependency chain and no provider lock-in. Install this extra only to cross-check
# our implementation against upstream.
ragas = ["ragas>=0.2.6", "langchain-community>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ------------------------------------------------------------------ tooling

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE and SLF are enabled deliberately: this codebase does catch broadly and does
# reach into private state in two places, and each is annotated with why. Enabling
# the rules makes those `noqa` markers meaningful instead of decorative.
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "BLE", "SLF"]
ignore = ["E501", "B008", "N806"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["^data/", "^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
