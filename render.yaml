# Render blueprint for the Shifa42 backend — native Python runtime, no Docker.
#
# NOT DEPLOYED. This file is written and correct; nothing here has been pushed to
# Render. It is committed so the deployment is reproducible by whoever runs it.
#
# Read the free-tier caveats at the bottom before deploying — they materially
# affect whether this behaves like the local stack.

services:
  - type: web
    name: shifa42-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    healthCheckPath: /api/health

    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        # Replace with the deployed Vercel origin. Never "*".
        value: https://shifa42.vercel.app
      - key: RATE_LIMIT
        value: 30/minute
      - key: GROUNDEDNESS_THRESHOLD
        value: "0.75"
      - key: MAX_REFORMULATIONS
        value: "2"
      - key: HF_HOME
        # Must point at the persistent disk, or the ~1.3 GB model is re-downloaded
        # on every cold start.
        value: /var/data/huggingface
      - key: EMBEDDING_DEVICE
        value: cpu

      # Set these in the Render dashboard, not here.
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

    disk:
      name: shifa42-data
      mountPath: /var/data
      sizeGB: 5

# ------------------------------------------------------------------------------
# Free-tier caveats — read before deploying
#
# 1. Memory. Render's free instance is 512 MB. bge-large-en-v1.5 needs roughly
#    1.3 GB resident, so THE FREE PLAN WILL OOM on model load. Either move to a
#    paid instance (>=2 GB), swap to bge-small-en-v1.5, or precompute embeddings
#    offline and serve query-time vectors from a hosted embedding API. This is a
#    real constraint, not a formality.
#
# 2. `pip install -e .` pulls torch, which is a large build on the free tier and
#    may exceed the build timeout. A CPU-only torch wheel index shortens it:
#      pip install torch --index-url https://download.pytorch.org/whl/cpu
#
# 3. Cold starts. Free services spin down after 15 minutes idle. The first request
#    afterwards pays the container start plus the model load.
#
# 4. Index population. Deploying only ships code. The corpus must be ingested and
#    embedded before the service can answer anything:
#      render shell shifa42-backend
#      python scripts/ingest_guidelines.py && python scripts/embed_index.py
#    Until then /api/health reports "degraded" with an empty vector store — the
#    intended behaviour, not a silent failure.
# ------------------------------------------------------------------------------
